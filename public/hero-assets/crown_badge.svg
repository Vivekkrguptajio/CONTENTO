<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="goldCrown" x1="10" y1="12" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="40" height="40" rx="10" fill="url(#purpleGrad)" />
  
  <!-- Stack of cash / platform at bottom -->
  <rect x="9" y="27" width="22" height="4" rx="1.5" fill="#4ade80" stroke="#16a34a" stroke-width="0.75" />
  <rect x="11" y="25" width="18" height="3" rx="1" fill="#86efac" />

  <!-- Golden Crown -->
  <path d="M10 24L12 15L17 19L20 12L23 19L28 15L30 24H10Z" fill="url(#goldCrown)" stroke="#a16207" stroke-width="0.75" filter="url(#glow)" />
  <!-- Jewels on tips -->
  <circle cx="12" cy="14.5" r="1.5" fill="#fef08a" />
  <circle cx="20" cy="11.5" r="1.8" fill="#fef08a" />
  <circle cx="28" cy="14.5" r="1.5" fill="#fef08a" />
  <!-- Crown Band Jewels -->
  <circle cx="15" cy="22" r="1" fill="#ef4444" />
  <circle cx="20" cy="22" r="1.2" fill="#3b82f6" />
  <circle cx="25" cy="22" r="1" fill="#ef4444" />

  <!-- Sparkles -->
  <polygon points="29,10 30,12 32,13 30,14 29,16 28,14 26,13 28,12" fill="#ffffff" />
</svg>
